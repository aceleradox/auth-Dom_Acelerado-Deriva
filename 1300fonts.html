<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1300fonts - Gerador de Letras Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand-primary: #8b5cf6;
            --brand-secondary: #ec4899;
        }
        
        body {
            font-family: 'Inter', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
            background-color: #0f1115;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        /* Scrollbar customizada e elegante */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1d24; 
        }
        ::-webkit-scrollbar-thumb {
            background: #3f4451; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--brand-primary); 
        }

        /* Efeito visual desenhado nas bordas das cartas */
        .glass-card {
            background: rgba(30, 33, 40, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .glass-card:hover {
            transform: translateY(-3px);
            border-color: rgba(139, 92, 246, 0.4);
            box-shadow: 0 10px 40px rgba(139, 92, 246, 0.15);
        }

        /* Animação do Toast de cópia */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translate(-50%, 20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        .toast-enter {
            animation: slideUpFade 0.4s ease-out forwards;
        }

        /* Custom Input Scrollbar */
        textarea::-webkit-scrollbar {
            width: 6px;
        }
        textarea::-webkit-scrollbar-track { background: transparent; }
        textarea::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    </style>
</head>

                { n: "Dbl Underline", apply: t => Array.from(t).map(c => c !== ' ' ? c + '\u0333' : c).join('') },
                { n: "Strike", apply: t => Array.from(t).map(c => c !== ' ' ? c + '\u0336' : c).join('') },
                { n: "Wave", apply: t => Array.from(t).map(c => c !== ' ' ? c + '\u0334' : c).join('') },
                { n: "Dots Below", apply: t => Array.from(t).map(c => c !== ' ' ? c + '\u0324' : c).join('') },
                { n: "Overline", apply: t => Array.from(t).map(c => c !== ' ' ? c + '\u0305' : c).join('') },
                { n: "Cross", apply: t => Array.from(t).map(c => c !== ' ' ? c + '\u0338' : c).join('') },
                { n: "Arrow Below", apply: t => Array.from(t).map(c => c !== ' ' ? c + '\u0362' : c).join('') },
                { n: "Glitch Lvl1", apply: t => Array.from(t).map(c => c !== ' ' ? c + '\u0310\u0324' : c).join('') },
                { n: "Glitch Lvl2", apply: t => Array.from(t).map(c => c !== ' ' ? c + '\u033f\u0346\u031a' : c).join('') },
                { n: "Slash", apply: t => Array.from(t).map(c => c !== ' ' ? c + '\u0337' : c).join('') },
                { n: "Dbl Overline", apply: t => Array.from(t).map(c => c !== ' ' ? c + '\u033F' : c).join('') },
                { n: "Tilde Below", apply: t => Array.from(t).map(c => c !== ' ' ? c + '\u0330' : c).join('') },
                { n: "Seagull", apply: t => Array.from(t).map(c => c !== ' ' ? c + '\u033C' : c).join('') },
                { n: "Zigzag", apply: t => Array.from(t).map(c => c !== ' ' ? c + '\u035B' : c).join('') }
            ];

            // Wrappers Puramente Textuais (Zero Emojis nas fontes)
            const wrappers = [
                ['【', '】'], ['『', '』'], ['«', '»'], ['[', ']'], ['{', '}'], ['<', '>'],
                ['~', ' '], ['-', '-'], ['=', '='], ['★', '★'], ['✦', '✦'], ['✿', '✿'], 
                ['†', '†'], ['⋆', '⋆'], ['♔', '♔'], ['♡', '♡'], ['♤', '♤'], ['♧', '♧'], 
                ['♢', '♢'], ['๑', '๑'], ['※', '※'], ['⁂', '⁂'], ['✧', '✧'], ['✪', '✪'], 
                ['❀', '❀'], ['✓', '✓'], ['✗', '✗'], ['∞', '∞'], ['☾', '☾'], ['☼', '☼'], 
                ['♪', '♪'], ['♫', '♫'], ['✂', '✂'], ['✎', '✎']
            ];

            const decorators = [
                { n: "", apply: t => t }, // Puro
                ...combiningMarks,
                ...wrappers.map(w => ({ n: w[0], apply: t => `${w[0]} ${t} ${w[1]}` }))
            ];
            
            const frequentEmojis = [
                "😀","😂","🥰","😎","🥺","😭","💀","🔥","✨","💯","❤️","👍","🎉","🌟","👑",
                "🦋","🌸","💔","👀","🌙","🚀","🎮","🎵","🍕","☕","👽","👻","🤖","💎","🍀"
            ];
            frequentEmojis.forEach(emoji => {
                const btn = document.createElement('button');
                btn.className = 'text-2xl p-2 hover:bg-white/10 rounded-xl transition-colors flex items-center justify-center';
                btn.innerText = emoji;
                btn.onclick = () => {
                    const cursor = textInput.selectionStart;
                    const text = textInput.value;
                    // Insere emoji na posição que o cursor estava
                    textInput.value = text.slice(0, cursor) + emoji + text.slice(cursor);
                    textInput.focus();
                    const newPos = cursor + emoji.length;
                    textInput.setSelectionRange(newPos, newPos);
                    updateResults(textInput.value);
                    emojiDropdown.classList.add('hidden'); // Fecha menu após inserção
                };
                emojiGrid.appendChild(btn);
            });

            // Toggle do Menu de Emojis
            emojiToggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                emojiDropdown.classList.toggle('hidden');
            });

            // Fechar menu de emojis ao clicar fora
            document.addEventListener('click', (e) => {
                if(!emojiDropdown.contains(e.target) && !emojiToggleBtn.contains(e.target)) {
                    emojiDropdown.classList.add('hidden');
                }
            });

            // Array.from lida perfeitamente com os "Surrogate Pairs" (Caracteres Unicode compostos)
            const normalArr = Array.from(normalChars);

            function translateString(text, mapString) {
                const mapArr = Array.from(mapString);
                return Array.from(text).map(char => {
                    const idx = normalArr.indexOf(char);
                    // Se encontrou a letra no normal, substitui pela mapeada, senão mantém original (ex: espaços, vírgulas)
                    return (idx !== -1 && mapArr[idx]) ? mapArr[idx] : char;
                }).join('');
            }

            let allStyles = [];
            // Pré-processando as combinações para que a renderização seja instantânea
            bases.forEach(base => {
                decorators.forEach(dec => {
                    let name = `${base.name}`;
                    if(dec.n) name += ` + ${dec.n}`;
                    allStyles.push({
                        name: name,
                        baseStr: base.chars,
                        applyDec: dec.apply
                    });
                });
            });
            
            // Stats atualizados (Vai dar 1265)
            statsCounter.innerHTML = `<span class="text-violet-400 font-bold">${allStyles.length}</span> estilos gerados!`;

            let renderQueue = [];
            let isRendering = false;
            let currentText = "";

            function renderBatch() {
                if (renderQueue.length === 0) {
                    isRendering = false;
                    return;
                }
                
                // Pega 50 elementos por frame (ajuste para suavidade)
                const batch = renderQueue.splice(0, 50);
                let htmlChunk = '';
                
                batch.forEach(style => {
                    // Transforma o texto
                    let mapped = translateString(currentText, style.baseStr);
                    let finalResult = style.applyDec(mapped);
                    
                    // Escapa as aspas pro HTML não quebrar
                    let safeResult = finalResult.replace(/"/g, '&quot;').replace(/'/g, '&#39;');

                    htmlChunk += `
                        <div class="glass-card rounded-2xl p-5 flex flex-col justify-between group h-full">
                            <div>
                                <span class="text-xs font-semibold text-violet-400/70 uppercase tracking-wider mb-2 block truncate">
                                    ${style.name}
                                </span>
                                <div class="text-xl md:text-2xl text-white font-normal break-all mb-4 select-all">
                                    ${finalResult}
                                </div>
                            </div>
                            <button onclick="copyToClipboard('${safeResult}', this)" 
                                class="w-full py-2.5 bg-white/5 hover:bg-violet-500/20 border border-white/5 hover:border-violet-500/50 rounded-xl text-sm font-medium transition-all flex items-center justify-center gap-2 group-hover:text-violet-300">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                                </svg>
                                <span>Copiar</span>
                            </button>
                        </div>
                    `;
                });

                resultsGrid.insertAdjacentHTML('beforeend', htmlChunk);

                if (renderQueue.length > 0) {
                    requestAnimationFrame(renderBatch);
                } else {
                    isRendering = false;
                }
            }

            let debounceTimer;
            function updateResults(text) {
                if(!text.trim()) text = defaultText;
                currentText = text;
                
                // Mostra ícone de clear se tiver texto real digitado
                if(textInput.value.trim().length > 0) {
                    clearBtn.classList.remove('opacity-0', 'pointer-events-none');
                } else {
                    clearBtn.classList.add('opacity-0', 'pointer-events-none');
                }

                // Limpa UI atual
                resultsGrid.innerHTML = '';
                loadingState.style.display = 'none';
                
                // Enche a fila de renderização
                renderQueue = [...allStyles];
                
                // Se já não estiver renderizando, inicia o loop
                if (!isRendering) {
                    isRendering = true;
                    requestAnimationFrame(renderBatch);
                }
            }

            textInput.addEventListener('input', (e) => {
                clearTimeout(debounceTimer);
                // Debounce de 150ms para evitar sobrecarga enquanto a pessoa digita rápido
                debounceTimer = setTimeout(() => {
                    updateResults(e.target.value);
                }, 150);
            });

            // Limpar Input
            clearBtn.addEventListener('click', () => {
                textInput.value = '';
                updateResults('');
                textInput.focus();
            });

            // Iniciar Primeira Renderização
            updateResults('');

        });

        let toastTimeout;
        window.copyToClipboard = function(text, btnElement) {
            // Método super compatível
            const textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.style.position = "fixed"; 
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand("copy");
                showToast();
                
                // Feedback visual no botão
                const originalHtml = btnElement.innerHTML;
                btnElement.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    <span class="text-green-400">Copiado!</span>
                `;
                btnElement.classList.add('border-green-500/50', 'bg-green-500/10');
                
                setTimeout(() => {
                    btnElement.innerHTML = originalHtml;
                    btnElement.classList.remove('border-green-500/50', 'bg-green-500/10');
                }, 2000);

            } catch (err) {
                console.error("Falha ao copiar", err);
            } finally {
                document.body.removeChild(textarea);
            }
        };

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('toast-enter');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }
    </script>
</body>
</html>
